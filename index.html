<!doctype html>
<html lang="en" style="background:#eeede4">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- The hero is a deep block filling the first screen, so the mobile
         browser chrome blends into it rather than into the cream below. -->
    <meta name="theme-color" content="#0d3479" />
    <title>The Growth Club — Growth Marketing Agency</title>
    <meta
      name="description"
      content="The Growth Club — a growth marketing agency for brands that are done guessing."
    />

    <!--
      The apex is canonical; www redirects to it at the Cloudflare end. These
      absolute URLs have to track the real domain: relative paths are ignored
      by every scraper, so a wrong host here means a shared link previews with
      no image at all.
    -->
    <link rel="canonical" href="https://thegrowth-club.com/" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Without these the link is a bare URL wherever it gets shared. The card
         is the hero itself — the wordmark bleeding to the gutters on deep — so
         a pasted link previews as the thing the page opens on. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Growth Club" />
    <meta property="og:url" content="https://thegrowth-club.com/" />
    <meta property="og:title" content="The Growth Club — Growth Marketing Agency" />
    <meta
      property="og:description"
      content="Websites, marketing and creative under one roof. A senior studio that builds the site, runs the marketing and makes the creative."
    />
    <meta property="og:image" content="https://thegrowth-club.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The word GROWTH set large in cream on a deep navy field, above the line: a senior studio that builds the site, runs the marketing and makes the creative."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Growth Club — Growth Marketing Agency" />
    <meta
      name="twitter:description"
      content="Websites, marketing and creative under one roof."
    />
    <meta name="twitter:image" content="https://thegrowth-club.com/og.png" />

    <style>
      /* Painted before any CSS or JS loads, so the first frame is the page's
         own ground rather than the browser's white. */
      html, body { background: #eeede4; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
